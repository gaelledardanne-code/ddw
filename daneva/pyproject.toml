[project]
name = "daneva"
version = "0.1.0"
description = "Daneva — Personal Hustle Planner"
requires-python = ">=3.12"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra --cov=app --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["app"]
omit = ["app/db/migrations/*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's Depends(...) is meant to be used as an argument default —
# that's how the framework's dependency injection works, not a mutable-
# default bug.
"app/api/*.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
files = ["app"]
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true
